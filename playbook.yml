---
- hosts: servers
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      tags:
        - packages

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - git
          - make
          - nodejs
        state: present
      tags:
        - packages

    - name: Create users
      ansible.builtin.user:
        name: "{{ item }}"
        state: present
      loop:
        - arya
        - sansa
        - tirion
      tags:
        - users